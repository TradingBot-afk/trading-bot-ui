<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f111a; color: white; padding: 20px; text-align: center; font-family: sans-serif; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🧪 ТЕСТ (Без авто-закрытия)</h2>
    <p>Нажми кнопку. Окно НЕ закроется, чтобы данные успели уйти.</p>
    
    <button class="btn" onclick="send('paper')"> Paper Trading</button>
    <button class="btn" onclick="send('sniper')">🎯 Sniper</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        function send(action) {
            try {
                // 1. Отправляем данные
                tg.sendData(JSON.stringify({ action: action }));
                
                // 2. Меняем текст на экране (не закрываем окно!)
                document.body.innerHTML = '<h1 style="color:#10b981; font-size: 40px;">✅ УСПЕХ!</h1><p>Данные отправлены.</p><p>Закрой окно вручную (крестик).</p>';
                
            } catch(e) {
                document.body.innerHTML = '<h1 style="color:red;">❌ ОШИБКА</h1><p>' + e + '</p>';
            }
        }
    </script>
</body>
</html>
