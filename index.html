<!DOCTYPE html>
<html>
<head>
    <title>TEST</title>
    <style>
        body { 
            background-color: #ff0000; /* ЯРКО КРАСНЫЙ ФОН */
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            margin-top: 50px;
        }
        button {
            padding: 20px; 
            font-size: 20px; 
            background: white; 
            border: none;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>ОБНОВЛЕНИЕ ПРОШЛО УСПЕШНО!</h1>
    <p>Версия от 16:00</p>
    <button onclick="alert('Кнопка работает!')">
        🔴 НАЖМИ МЕНЯ
    </button>

    <script>
        // Простая логика
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        function send(data) {
            alert('Отправил: ' + data);
            tg.sendData(JSON.stringify({action: data}));
            setTimeout(()=>tg.close(), 1000);
        }
    </script>
</body>
</html>
