<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f111a; color: white; padding: 20px; text-align: center; font-family: sans-serif; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🧪 ТЕСТ WEB APP</h2>
    <p>Нажми кнопку:</p>
    
    <button class="btn" onclick="testSend('paper')">📊 ТЕСТ 1: Paper</button>
    <button class="btn" onclick="testSend('sniper')">🎯 ТЕСТ 2: Sniper</button>
    
    <div id="log" style="margin-top: 20px; padding: 10px; background: #1c1f2e; border-radius: 8px; font-size: 12px; text-align: left;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            logDiv.innerHTML += '<br>🔹 ' + msg;
            console.log(msg);
        }

        function testSend(action) {
            log('1. Кнопка нажата: ' + action);
            
            // Способ 1: Через Telegram SDK
            try {
                log('2. Вызываю tg.sendData...');
                const data = JSON.stringify({ action: action });
                tg.sendData(data);
                log('3. sendData вызван успешно!');
                
                setTimeout(() => {
                    log('4. Закрываю окно...');
                    tg.close();
                }, 1000);
                
            } catch (e) {
                log('❌ Ошибка sendData: ' + e.message);
                tg.showAlert('Ошибка: ' + e.message);
            }
        }
    </script>
</body>
</html>
