<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f111a; color: white; padding: 20px; text-align: center; font-family: sans-serif; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; background: #1c1f2e; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <h2>🧪 ФИНАЛЬНЫЙ ТЕСТ</h2>
    <button class="btn" onclick="send('paper')">📊 Paper</button>
    <button class="btn" onclick="send('sniper')">🎯 Sniper</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const status = document.getElementById('status');
        
        function show(msg) {
            status.innerHTML += '<br>• ' + msg;
            console.log(msg);
        }

        function send(action) {
            show('Отправка: ' + action);
            
            // Способ 1: Стандартный sendData
            try {
                tg.sendData(JSON.stringify({ action: action }));
                show('✓ sendData отправлен');
            } catch(e) {
                show('✗ sendData ошибка: ' + e.message);
            }
            
            // Способ 2: Закрываем окно (Telegram сам должен отправить данные)
            setTimeout(() => {
                show('Закрываю окно...');
                tg.close();
            }, 1000);
        }
    </script>
</body>
</html>
