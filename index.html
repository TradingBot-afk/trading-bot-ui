<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f111a; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #1c1f2e; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn { 
            width: 100%; padding: 15px; margin-top: 10px; 
            background: #3b82f6; color: white; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
        }
        .btn:active { background: #2563eb; }
    </style>
</head>
<body>
    <h2>🤖 Тестовая Панель</h2>
    
    <div class="card">
        <h3>📊 Paper Trading</h3>
        <button class="btn" onclick="sendData('paper')">Открыть</button>
    </div>

    <div class="card">
        <h3>🎯 Sniper</h3>
        <button class="btn" onclick="sendData('sniper')">Настройки</button>
    </div>

    <div class="card">
        <h3> AI Agent</h3>
        <button class="btn" onclick="sendData('agent')">Анализ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Раскрываем на весь экран

        function sendData(action) {
            console.log("🔹 Отправка:", action);
            // Отправляем данные боту
            tg.sendData(JSON.stringify({ action: action }));
            
            // Telegram должен закрыть окно сам, но на всякий случай:
            setTimeout(() => tg.close(), 500);
        }
    </script>
</body>
</html>
