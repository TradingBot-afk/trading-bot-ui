<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trading Bot Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f111a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 15px 0; background: #3b82f6; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .btn:active { background: #2563eb; }
    </style>
</head>
<body>
    <h1>🧪 Тест связи</h1>
    <p>Нажми кнопку ниже:</p>

    <button class="btn" onclick="sendData('paper')">📊 Paper Trading</button>
    <button class="btn" onclick="sendData('sniper')">🎯 Sniper</button>
    <button class="btn" onclick="sendData('agent')">🤖 AI Agent</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendData(action) {
            // Отправляем данные
            try {
                tg.sendData(JSON.stringify({ action: action }));
                // Показываем сообщение об успехе, но НЕ закрываем окно сразу
                document.body.innerHTML = '<h2 style="color:#10b981; margin-top:50px;">✅ Данные отправлены!</h2><p>Можешь закрыть окно крестиком.</p>';
            } catch (e) {
                alert('Ошибка: ' + e);
            }
        }
    </script>
</body>
</html>
